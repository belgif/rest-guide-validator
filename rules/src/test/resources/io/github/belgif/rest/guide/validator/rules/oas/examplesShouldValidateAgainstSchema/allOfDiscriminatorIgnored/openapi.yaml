openapi: "3.0.3"
info:
  title: "My Test"
  version: "0.3"
paths: {}
components:
  schemas:
    TestSchema:
      description: test schema
      type: object
      properties:
        schemaUnderTest:
          $ref: "schemas.yaml#/components/schemas/TopLevel"
      required:
        - schemaUnderTest
      example: {
         "schemaUnderTest": {
           "objectType": "firstChild",
           "dataSource": "myDataSource",
           "firstChildProperty": 123  # should be string, but ignored because schema only reached through the discriminator is ignored
         }
      }
