openapi: 3.0.1
info:
  title: TestCase
  version: '1.0'
servers:
  - url: '/api/v1'
paths: {}
components:
  schemas:
    SchemaUnderTest:
      discriminator:
        propertyName: type
        mapping:
          first: "#/components/schemas/SchemaOne"
          second: "#/components/schemas/SchemaTwo"
      oneOf:
        - $ref: '#/components/schemas/SchemaOne'
        - $ref: '#/components/schemas/SchemaTwo'
    SchemaOne:
      allOf:
        - $ref: '#/components/schemas/BaseSchema'
        - type: object
          properties:
            myOtherProperty:
              type: string
    SchemaTwo:
      allOf:
        - $ref: '#/components/schemas/BaseSchema'
        - type: object
          properties:
            something:
              type: number
    BaseSchema:
      type: object
      properties:
        firstProperty:
          type: string
        type:
          type: string
      required:
        - type