# Maven CI build for the belgif rest-guide-validator project
name: rest-guide-validator-maven-ci
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        maven: [ '3.8.5', '3.9.9' ]
    steps:
#    Setup Maven action to specify maven version > required for BUG https://issues.apache.org/jira/browse/MNG-7055
    - name: Setup Maven Action
      uses: s4u/setup-maven-action@5d4481650d2563723ad6c5e8f009ac8fd746e3e8 # v1.22.0
      with:
        java-version: '17'
        java-distribution: 'adopt'
        maven-version: ${{ matrix.maven }}
        cache-enabled: 'false'
    - name: Build with Maven
      run: mvn -B verify